name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI never needs any secrets: the build is fully static and offline.
  # (No provider config, no API tokens, no scraping — see README.)
  CI: "true"

jobs:
  check:
    name: install / check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check)
        run: pnpm check

      - name: Test (node:test)
        run: pnpm test

      - name: Reproduce normalized SPS data (deterministic drift gate)
        run: pnpm check:sps

      - name: Reproduce normalized Peakbagger data (deterministic drift gate)
        run: pnpm check:peakbagger

      - name: Build static site
        run: pnpm build

      - name: Verify static output
        run: test -f dist/index.html
